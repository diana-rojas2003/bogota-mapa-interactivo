<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa interactivo de Bogotá — capas temáticas abiertas</title>
  <meta name="description" content="Mapa web interactivo de Bogotá D.C. con localidades, ciclorrutas, estaciones de TransMilenio, paraderos del SITP y parques. Datos abiertos oficiales.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc="
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
        integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA="
        crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="brand" role="banner">
        <span class="brand-mark">B</span>
        <div>
          <div class="brand-title">Mapa interactivo de Bogotá</div>
          <div class="brand-sub">Capas temáticas abiertas de Bogotá D.C.</div>
        </div>
      </div>
      <div class="header-right">
        <span class="chip" id="chip-total" role="status">Cargando capas…</span>
        <button class="btn-reset" id="btn-reset" aria-label="Restablecer vista inicial">Restablecer vista</button>
      </div>
    </div>
  </header>

  <!-- Mapa -->
  <div class="map-wrap" role="region" aria-label="Mapa de Bogotá">
    <div id="map" class="map"></div>

    <!-- Panel de capas (desktop: lateral; móvil: deslizante) -->
    <aside class="layers-panel" id="layers-panel" role="region" aria-label="Capas del mapa">
      <div class="panel-head">
        <h2 id="panel-title">Capas</h2>
        <button class="btn-close" id="btn-close-panel" aria-label="Cerrar panel de capas">×</button>
      </div>

      <div class="panel-search-wrap">
        <input type="search" id="panel-search" placeholder="Buscar capa…" aria-label="Buscar capa">
      </div>

      <div class="layer-list" id="layer-list" role="listbox" aria-label="Listado de capas temáticas">
      </div>

      <div class="panel-foot">
        <p class="panel-note" id="panel-note"></p>
      </div>
    </aside>

    <!-- Botón móvil para abrir el panel -->
    <button class="btn-panel-toggle" id="btn-panel-toggle" aria-label="Abrir panel de capas">Capas</button>

    <!-- Leyenda flotante -->
    <div class="legend" id="legend" role="region" aria-label="Leyenda de capas activas">
      <div class="legend-head">
        <span class="legend-title">Leyenda</span>
        <button class="btn-close" id="btn-close-legend" aria-label="Cerrar leyenda">×</button>
      </div>
      <div class="legend-body" id="legend-body">
        <p class="legend-empty">Ninguna capa activa.</p>
      </div>
    </div>

    <!-- Contador y aviso de carga -->
    <div class="floating-info" id="floating-info" aria-live="polite"></div>

    <!-- Pie de fuentes -->
    <footer class="sources" id="sources" role="contentinfo">
      <button class="btn-sources" id="btn-sources" aria-expanded="false" aria-controls="sources-detail">Fuentes de datos ▾</button>
      <div class="sources-detail" id="sources-detail" hidden>
      </div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg="
          crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
